# Dev contour: only Postgres in Docker, apps run locally (see dev.cmd / dev.ps1).
name: fakeservers-dev

services:
  db:
    image: postgres:18-alpine
    container_name: fakeservers-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fakeservers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fakeservers}
    ports:
      - "${POSTGRES_PORT:-4402}:5432"
    volumes:
      - fakeservers-pg-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  fakeservers-pg-dev:
